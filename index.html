    <title>Cocotte — un petit jeu de ferme</title>
    <meta name="description" content="Cocotte, un petit jeu de ferme en 3D : élevez vos poules, ramassez les œufs et vendez-les au village. Gratuit, dans le navigateur." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cocotte — un petit jeu de ferme" />

    <meta name="twitter:card" content="summary" />

    <style>
      html, body { margin: 0; height: 100%; background: #f1e9da; -webkit-tap-highlight-color: transparent; }
      #boot { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f1e9da; color: #3a332b; font: 800 30px/1.1 system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity 0.4s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot i { width: 46px; height: 58px; background: #fbf3e2; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: inset -6px -8px 0 #ecd9b6, 0 8px 0 -3px rgba(58, 51, 43, 0.14); animation: boot-egg 0.9s ease-in-out infinite; }
      #boot small { font-size: 14px; font-weight: 600; opacity: 0.65; }
      @keyframes boot-egg { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-label="Chargement"><i></i>Cocotte<small>La ferme se réveille…</small></div>
    <div id="world"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
